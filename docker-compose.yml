version: '3.8'
services:
  froid-backend:
    build: ./froid-server
    ports:
      - "8000:8000"
    environment:
      - GOOGLE_CLIENT_ID=109290160674-cbmk7j15patqk0679joi43lr2ndm5fal.apps.googleusercontent.com
      - GOOGLE_AUTH_DEV_FALLBACK=${GOOGLE_AUTH_DEV_FALLBACK:-true}
      - FROID_LOCAL_AUTH_EMAILS=${FROID_LOCAL_AUTH_EMAILS:-}
      - FROID_LOCAL_AUTH_PASSWORD=${FROID_LOCAL_AUTH_PASSWORD:-}
    restart: unless-stopped
  froid-frontend:
    build: ./froid-dashboard
    ports:
      - "5173:80"
    restart: unless-stopped
