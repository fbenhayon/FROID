services:
  froid-edge:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./froid-site:/srv/froid-site:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - froid-frontend
      - froid-backend
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: "20m"
        max-file: "10"
  froid-backend:
    build: ./froid-server
    ports:
      - "8000:8000"
    environment:
      - GOOGLE_CLIENT_ID=109290160674-cbmk7j15patqk0679joi43lr2ndm5fal.apps.googleusercontent.com
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GOOGLE_AUTH_CLIENT_ID=${GOOGLE_AUTH_CLIENT_ID:-}
      - GOOGLE_CALENDAR_CLIENT_ID=${GOOGLE_CALENDAR_CLIENT_ID:-}
      - GOOGLE_CALENDAR_CLIENT_SECRET=${GOOGLE_CALENDAR_CLIENT_SECRET:-}
      - GOOGLE_AUTH_DEV_FALLBACK=${GOOGLE_AUTH_DEV_FALLBACK:-false}
      - FROID_ALLOWED_ORIGINS=${FROID_ALLOWED_ORIGINS:-https://www.froid.com.br,https://froid.com.br}
      - FROID_SESSION_TOKEN_TTL_SECONDS=${FROID_SESSION_TOKEN_TTL_SECONDS:-28800}
      - FROID_PUBLIC_URL=${FROID_PUBLIC_URL:-https://www.froid.com.br}
      - FROID_LOCAL_AUTH_EMAILS=${FROID_LOCAL_AUTH_EMAILS:-}
      - FROID_LOCAL_AUTH_PASSWORD=${FROID_LOCAL_AUTH_PASSWORD:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - OPENAI_TRANSCRIBE_MODEL=${OPENAI_TRANSCRIBE_MODEL:-gpt-4o-transcribe}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      - STRIPE_PRICE_PRO_10=${STRIPE_PRICE_PRO_10:-}
      - STRIPE_PRICE_PRO_25=${STRIPE_PRICE_PRO_25:-}
      - STRIPE_PRICE_PLUS_50=${STRIPE_PRICE_PLUS_50:-}
      - STRIPE_PRICE_PLUS_100=${STRIPE_PRICE_PLUS_100:-}
      - STRIPE_PRICE_MASTER_25=${STRIPE_PRICE_MASTER_25:-}
      - FROID_TOKEN_ENCRYPTION_KEYS=${FROID_TOKEN_ENCRYPTION_KEYS:-}
      - FROID_CLINICAL_RECORD_ENCRYPTION_KEYS=${FROID_CLINICAL_RECORD_ENCRYPTION_KEYS:-}
      - FROID_SUBSCRIPTIONS_REQUIRED=${FROID_SUBSCRIPTIONS_REQUIRED:-false}
      - FROID_PROFESSIONAL_APPROVAL_REQUIRED=${FROID_PROFESSIONAL_APPROVAL_REQUIRED:-false}
      - STRIPE_CURRENCY=${STRIPE_CURRENCY:-usd}
      - FROID_ALLOW_LOCAL_BILLING_FALLBACK=${FROID_ALLOW_LOCAL_BILLING_FALLBACK:-false}
      - FROID_LEGAL_ACCEPTANCE_REQUIRED=${FROID_LEGAL_ACCEPTANCE_REQUIRED:-false}
      - FROID_LEGAL_AUDIT_HMAC_KEY=${FROID_LEGAL_AUDIT_HMAC_KEY:-}
      - FROID_LEGAL_SUPPLIER_NAME=${FROID_LEGAL_SUPPLIER_NAME:-}
      - FROID_LEGAL_SUPPLIER_TAX_ID=${FROID_LEGAL_SUPPLIER_TAX_ID:-}
      - FROID_LEGAL_SUPPLIER_ADDRESS=${FROID_LEGAL_SUPPLIER_ADDRESS:-}
      - FROID_LEGAL_CONTACT_EMAIL=${FROID_LEGAL_CONTACT_EMAIL:-}
      - FROID_LEGAL_PRIVACY_EMAIL=${FROID_LEGAL_PRIVACY_EMAIL:-}
      - FROID_EXPLICA_MODEL=${FROID_EXPLICA_MODEL:-gemini-1.5-pro}
      - FROID_CHROMA_PATH=${FROID_CHROMA_PATH:-/data/chroma_db}
      - FROID_DUCKDB_PATH=${FROID_DUCKDB_PATH:-/data/datamart_anonymous_v3.duckdb}
      - FROID_ANALYTICS_MIN_K=${FROID_ANALYTICS_MIN_K:-50}
      - FROID_ANALYTICS_MAX_SUPPRESSION_RATIO=${FROID_ANALYTICS_MAX_SUPPRESSION_RATIO:-0.10}
      - FROID_DATAMART_PSEUDONYM_KEY=${FROID_DATAMART_PSEUDONYM_KEY:-}
      - FROID_TURN_URLS=${FROID_TURN_URLS:-}
      - FROID_TURN_SECRET=${FROID_TURN_SECRET:-}
      - FROID_TURN_CREDENTIAL_TTL_SECONDS=${FROID_TURN_CREDENTIAL_TTL_SECONDS:-3600}
      - FROID_ICE_TRANSPORT_POLICY=${FROID_ICE_TRANSPORT_POLICY:-all}
      - FROID_REQUIRE_TURN=${FROID_REQUIRE_TURN:-false}
      - FROID_SESSION_REPORTS_PATH=${FROID_SESSION_REPORTS_PATH:-/data/session_reports.json}
      - FROID_IDENTITY_STATE_PATH=${FROID_IDENTITY_STATE_PATH:-/data/identity_state.json}
      - FROID_PATIENT_SESSION_TTL_SECONDS=${FROID_PATIENT_SESSION_TTL_SECONDS:-7200}
      - FROID_PERSISTENCE_MODE=${FROID_PERSISTENCE_MODE:-legacy}
      - FROID_DATABASE_URL=${FROID_DATABASE_URL:-}
      - FROID_RUNTIME_DATABASE_URL=${FROID_RUNTIME_DATABASE_URL:-}
      - FROID_TENANT_AUTHORIZATION_MODE=${FROID_TENANT_AUTHORIZATION_MODE:-off}
      - FROID_TENANT_ENFORCEMENT_ORGANIZATIONS=${FROID_TENANT_ENFORCEMENT_ORGANIZATIONS:-}
      - FROID_SHARED_CREDITS_MODE=${FROID_SHARED_CREDITS_MODE:-off}
      - FROID_SHARED_CREDITS_ORGANIZATIONS=${FROID_SHARED_CREDITS_ORGANIZATIONS:-}
    volumes:
      - ./data:/data
    networks:
      - default
      - froid-data
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: "50m"
        max-file: "20"
  froid-postgres:
    image: postgres:16-alpine
    profiles: ["multitenant"]
    environment:
      - POSTGRES_DB=${FROID_POSTGRES_DB:-froid}
      - POSTGRES_USER=${FROID_POSTGRES_USER:-froid}
      - POSTGRES_PASSWORD=${FROID_POSTGRES_PASSWORD:-}
    volumes:
      - froid_postgres_data:/var/lib/postgresql/data
      - ./backups/postgres:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  froid-frontend:
    build:
      context: ./froid-dashboard
      args:
        - VITE_GOOGLE_CLIENT_ID=${GOOGLE_AUTH_CLIENT_ID:-109290160674-cbmk7j15patqk0679joi43lr2ndm5fal.apps.googleusercontent.com}
    ports:
      - "5173:80"
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: "20m"
        max-file: "10"
  froid-turn:
    image: coturn/coturn:4.14.0-r0
    profiles: ["webrtc"]
    network_mode: host
    volumes:
      - ${FROID_TURN_CONFIG_PATH:-./data/turnserver.conf}:/etc/coturn/turnserver.conf:ro
    tmpfs:
      - /var/lib/coturn:size=16m,mode=0700
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: "20m"
        max-file: "10"

volumes:
  caddy_data:
  caddy_config:
  froid_postgres_data:

networks:
  froid-data:
    external: true
    name: ${FROID_DATA_NETWORK:-froid_froid-network}
