server {
    listen 80;
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # O index.html e o mapa que aponta para os bundles com hash no nome. Os
    # bundles podem ser cacheados para sempre justamente porque o nome muda a
    # cada build — mas o mapa, nao: cacheado, o navegador continua pedindo os
    # arquivos da versao anterior, que o deploy acabou de apagar. E a origem do
    # vite:preloadError que main.tsx recupera recarregando a pagina.
    #
    # Ate aqui esta resposta saia sem Cache-Control nenhum, e o navegador
    # aplicava heuristica propria. Num link que vai para centenas de
    # trabalhadores, "depende do navegador" nao e resposta: quem pegasse a
    # versao velha do mapa continuaria recebendo o painel antigo depois do
    # deploy que corrigiu o convite dele.
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
}
